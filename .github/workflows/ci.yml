name: Core CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conflict-marker guard self-test
        run: python3 tools/check_conflict_markers.py --self-test
      - name: Conflict-marker guard
        run: python3 tools/check_conflict_markers.py
      - name: Configure
        run: cmake -S . -B build -DCCB_SIPM_BUILD_TESTS=ON -DCCB_SIPM_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
